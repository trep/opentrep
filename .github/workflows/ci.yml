name: OpenTREP CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake gcc g++ cppcheck \
          zlib1g-dev libbz2-dev libgmp-dev \
          libxapian-dev graphviz \
          libreadline-dev libncurses5-dev \
          libzmq3-dev libssl-dev libffi-dev \
          sqlite3 libsqlite3-dev \
          libmariadb-dev-compat libmariadb-dev postgresql-client \
          libicu-dev libprotobuf-dev protobuf-compiler \
          python3-dev python3-setuptools python3-wheel \
          libboost-all-dev libsoci-dev libgtest-dev google-mock \
          doxygen ghostscript texlive-latex-recommended
          
    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE:STRING=Debug -DINSTALL_DOC:BOOL=ON -DRUN_GCOV:BOOL=OFF -DLIB_SUFFIX= ..
        
    - name: Build
      run: |
        cd build
        make -j$(nproc)
        
    - name: Install
      run: |
        sudo cmake --install build

    - name: Run Tests
      run: |
        cd build
        make check || make test || ctest -V
