name: OpenTREP CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ libboost-all-dev sqlite3 libsqlite3-dev \
          libreadline-dev libicu-dev python3-dev xapian-tools libxapian-dev \
          libprotobuf-dev protobuf-compiler libgtest-dev google-mock doxygen
          
    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake ..
        
    - name: Build
      run: |
        cd build
        make -j$(nproc)
        
    - name: Run Tests
      run: |
        cd build
        make test
